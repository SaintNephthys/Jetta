<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f0f9ff" />
    <meta name="description" content="A collection of games to exercise your mind every day." />
    <title>JETTA — A little brain exercise every day</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="JETTA home"
          ><span class="brand-icon" aria-hidden="true">✳</span><span>JETTA</span></a
        ><button
          id="theme-toggle"
          class="theme-toggle icon-button"
          type="button"
          aria-label="Switch to dark mode"
          title="Change color theme"
        >
          <span aria-hidden="true">☾</span>
        </button>
      </div>
    </header>
    <main id="app">
      <section id="home" class="games-section" aria-labelledby="games-title">
        <h1 id="games-title">Games</h1>
        <div class="game-grid">
          <a class="game-card" id="open-game" href="games/arithmetic.html"
            ><div class="game-card-symbols" aria-hidden="true">＋ − × ÷</div>
            <div class="game-card-bottom">
              <div>
                <h2>Arithmetic Practice</h2>
                <p>Sharpen your skills in the four basic operations.</p>
              </div>
              <span class="play-label" aria-hidden="true">Play →</span>
            </div></a
          >
        </div>
      </section>
    </main>
    <footer>
      <div><a class="footer-brand" href="index.html">✳ JETTA</a><span>© 2026 JETTA</span></div>
    </footer>
  </body>
</html>
